syntax = "proto3";

package history.v1;

// Generated Go lands in internal/history as package `history`, alongside the
// hand-written HistoryStore that reads and writes these events.
option go_package = "github.com/olayanju-1234/durable-workflow-engine/internal/history;history";

// HistoryEvent is one entry in a workflow's append-only history log. The log is
// the single source of truth: replaying it reconstructs all workflow state.
message HistoryEvent {
  // Monotonic sequence within a single workflow, starting at 1.
  int64 event_id = 1;
  // Wall-clock time the event was recorded, unix nanoseconds.
  int64 timestamp = 2;
  // In cluster mode, the Raft log index that committed this event; it lets a
  // node re-apply its log after a restart without writing an event twice.
  // Zero in single-node mode. Older binaries ignore it.
  uint64 raft_index = 3;
  // The oldest history format that reads this event correctly (see
  // docs/UPGRADING.md); unset means the base format, which every binary reads.
  // A binary whose format is lower refuses to start rather than misread it.
  uint32 min_reader_format = 4;
  // Set when the event is encrypted at rest (ADR-0022): the attributes below
  // are empty, and sealed holds them, encrypted with AES-256-GCM under the
  // key named key_id. Such an event needs history format 7.
  bytes sealed = 5;
  string key_id = 6;

  // Exactly one attributes message is set per event; the field that is present
  // determines the event type. New event types get new oneof fields, which is
  // how the schema evolves without breaking old logs.
  oneof attributes {
    WorkflowStartedEvent workflow_started = 10;
    StepScheduledEvent step_scheduled = 11;
    StepCompletedEvent step_completed = 12;
    StepFailedEvent step_failed = 13;
    WorkflowCompletedEvent workflow_completed = 14;
    WorkflowFailedEvent workflow_failed = 15;
    TimerStartedEvent timer_started = 16;
    TimerFiredEvent timer_fired = 17;
    SignalReceivedEvent signal_received = 18;
    MarkerRecordedEvent marker_recorded = 19;
  }
}

message WorkflowStartedEvent {
  string workflow_id = 1;
  string workflow_type = 2;
  bytes input = 3;
  // Optional: the workflow times out this long after this event's timestamp
  // (recorded as a duration; the deadline is derived, so recovery re-arms it).
  // Zero means no limit. Older binaries ignore it and never time out.
  int64 execution_timeout_ms = 4;
  // This run's id. A workflow id has one run at a time; continue-as-new and
  // id reuse start another under the same id. Empty in histories from before
  // 0.3.0, whose run id is derived from this event's timestamp.
  string run_id = 5;
  // The run this one continued from (continue-as-new), if any.
  string continued_from_run_id = 6;
  // The task queue the run's workflow tasks go to, and its activities unless
  // they name another. Empty is the default queue. A non-default queue needs
  // history format 6: older binaries would hand its tasks to default pollers.
  string task_queue = 7;
  // Set on a run an operator reset: the run it was reset from, the id of the
  // first event of that run it left out, and why. The run starts with the
  // events before that one, copied unchanged, so its code replays them as
  // before. Older binaries ignore these and read an ordinary run.
  string reset_from_run_id = 8;
  int64 reset_event_id = 9;
  string reset_reason = 10;
  // The run's place in a distributed trace (ADR-0024): set when the start
  // carried a W3C traceparent, or the engine exports traces. Recorded so the
  // run's span, and every task's parent, survive restarts. Older binaries
  // ignore it.
  TraceContext trace = 11;
}

// TraceContext is a span in a W3C Trace Context / OpenTelemetry trace.
message TraceContext {
  bytes trace_id = 1;       // 16 bytes
  bytes span_id = 2;        // 8 bytes: this run's span
  bytes parent_span_id = 3; // 8 bytes: the span that started it; empty for a root
  bool sampled = 4;         // the traceparent's sampled flag
  string trace_state = 5;   // the caller's tracestate, passed on unchanged
}

message StepScheduledEvent {
  string step_name = 1;
  bytes input = 2;
  int64 sequence = 3;
  // A signal wait is a step with no worker task: it records a StepScheduled with
  // awaits_signal set and the awaited signal_name, so recovery and signal delivery
  // are driven by history alone (no need to consult the workflow definition/code).
  bool awaits_signal = 4;
  string signal_name = 5;
  // Set when the workflow code chose this activity's retry policy (Phase 5
  // polish). Recorded so retries follow it across restarts; absent means the
  // engine's policy for the step name applies. Older binaries ignore it.
  RetryPolicy retry_policy = 6;
  // Optional activity timeouts, set by the workflow code and copied onto every
  // retry. start_to_close bounds one attempt from dispatch to result (a
  // heartbeat does not extend it); schedule_to_close bounds the whole step,
  // every attempt and backoff included, from its first StepScheduled. Zero
  // means no limit. Older binaries ignore them.
  int64 start_to_close_timeout_ms = 7;
  int64 schedule_to_close_timeout_ms = 8;
  // The task queue the activity's tasks go to: the workflow code's choice, or
  // the workflow's queue. Empty is the default queue. Copied onto every retry.
  string task_queue = 9;
}

// RetryPolicy re-runs a failed activity before the workflow sees the error.
// Backoff doubles after each failed attempt, capped at max_backoff_ms.
message RetryPolicy {
  // Attempts in total, counting the first: 1 means no retries.
  int32 max_attempts = 1;
  int64 initial_backoff_ms = 2;
  // Zero means no cap.
  int64 max_backoff_ms = 3;
  // A failure whose error type is listed here is not retried: the workflow
  // sees it at once (say, a 4xx answer that will never succeed). Older
  // binaries ignore it and retry.
  repeated string non_retryable_error_types = 4;
}

message StepCompletedEvent {
  string step_name = 1;
  bytes output = 2;
  int64 sequence = 3;
}

message StepFailedEvent {
  string step_name = 1;
  string error = 2;
  int64 sequence = 3;
  int32 retry_count = 4;
  // The engine will retry this step: the failure is not the step's result and
  // workflow code must not see it. Older binaries ignore it.
  bool will_retry = 5;
  // The step was cancelled, not failed: workflow code cancelled it (a lost
  // race, say), so a worker still running it is told to stop. Any step kind can
  // be cancelled this way. Older binaries read it as a failure.
  bool cancelled = 6;
  // The worker's name for the kind of failure (an error class, or one of the
  // engine's: LeaseExpired, StartToCloseTimeout, ScheduleToCloseTimeout),
  // matched against RetryPolicy.non_retryable_error_types.
  string error_type = 7;
  // The worker said the failure is not worth retrying, whatever the policy.
  bool non_retryable = 8;
}

message WorkflowCompletedEvent {
  bytes output = 1;
  // Set when the run ended by continuing as new: the workflow id goes on as a
  // fresh run, with an empty history, described here. Older binaries read it
  // as a plain completion, so it needs history format 5.
  ContinuedAsNew continued_as_new = 2;
}

// ContinuedAsNew is what the next run of a workflow starts with.
message ContinuedAsNew {
  string run_id = 1;
  string workflow_type = 2;
  bytes input = 3;
  int64 execution_timeout_ms = 4;
  // The next run's task queue (empty: the default queue).
  string task_queue = 5;
  // The next run's span: the same trace, a child of this run's span.
  TraceContext trace = 6;
}

message WorkflowFailedEvent {
  string error = 1;
  // Set when the failure was an operator termination (the visibility API's
  // TerminateWorkflow), not workflow code failing. Same terminal state machine
  // path either way; this flag keeps the two distinguishable after the fact.
  bool terminated = 2;
  // Set when the engine ended the workflow because its execution timeout
  // passed. Older binaries read it as a plain failure.
  bool timed_out = 3;
  // Set when a client cancelled the workflow (CancelWorkflow). Older binaries
  // read it as a plain failure.
  bool cancelled = 4;
}

// TimerStartedEvent opens a durable timer step: the workflow is paused until
// fire_at. fire_at is recorded (not just a duration) so crash recovery can re-arm
// the timer against the same absolute deadline after a restart.
message TimerStartedEvent {
  string step_name = 1;
  int64 sequence = 2;
  int64 fire_at = 3; // unix nanoseconds when the timer should fire
  bytes input = 4;   // carried through so the pipeline chains across the sleep
}

// TimerFiredEvent closes a timer step once its deadline has passed, resuming the
// workflow. It is recorded by the engine's timer service, not by a worker.
message TimerFiredEvent {
  string step_name = 1;
  int64 sequence = 2;
}

// SignalReceivedEvent records an external signal delivered to a running workflow.
// Signals are buffered in the log: one that arrives before the workflow waits for
// it is matched to the matching wait later, in arrival order.
message SignalReceivedEvent {
  string signal_name = 1;
  bytes payload = 2;
  // The sender's idempotency key, if it gave one: a SignalWorkflow retried
  // with the same key (say, after a leader change hid the reply) finds it here
  // and is not recorded again. Older binaries ignore it.
  string request_id = 3;
  // Set when this is not a signal but a request to cancel the workflow
  // gracefully: workflow code is told, and may compensate before it ends
  // CANCELLED. The signal name is reserved (__workflowd.cancel) and the payload
  // is the reason. Older binaries would read an ordinary signal nobody waits
  // for, so it needs history format 5.
  bool cancel_request = 4;
}

// MarkerRecordedEvent records a value workflow code must see identically on
// every replay: which version of changed code an execution runs
// (workflow.GetVersion), or the result of a non-deterministic call
// (workflow.SideEffect). It is a step that completes as it is recorded: it
// takes a sequence number but involves no worker. Added in Phase 5; binaries
// built before it cannot read a history that contains one.
message MarkerRecordedEvent {
  // The change id (version markers) or the caller's name (side effects).
  string step_name = 1;
  int64 sequence = 2;
  // "version", "side_effect" or "cancel" (where workflow code received a
  // graceful cancellation; data is the history length its decision saw).
  string marker = 3;
  // Version markers: the version as a decimal string. Side effects: the result.
  bytes data = 4;
}
