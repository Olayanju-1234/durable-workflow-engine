syntax = "proto3";

package raft.v1;

// Generated Go lands in internal/raft as package `raft`, alongside the
// hand-written core that implements the algorithm.
option go_package = "github.com/olayanju-1234/durable-workflow-engine/internal/raft;raft";

// RaftService is the peer-to-peer protocol between nodes in a cluster. It is
// deliberately separate from WorkflowService: that one faces clients and
// workers, this one is internal cluster traffic and should never be exposed.
//
// The paper describes RequestVote and AppendEntries as request/response RPCs.
// Here every request and every response is its own one-way message, delivered
// by a single Send call. That keeps the Raft core a pure "message in, messages
// out" state machine that never blocks on the network, and it matches what
// Raft already tolerates: messages may be lost, duplicated or reordered.
service RaftService {
  rpc Send(Envelope) returns (SendAck);
}

// Envelope carries one Raft message between two nodes.
message Envelope {
  string from = 1;
  string to = 2;
  oneof body {
    RequestVoteRequest request_vote = 10;
    RequestVoteResponse request_vote_response = 11;
    AppendEntriesRequest append_entries = 12;
    AppendEntriesResponse append_entries_response = 13;
    InstallSnapshotRequest install_snapshot = 14;
    InstallSnapshotResponse install_snapshot_response = 15;
  }
}

// SendAck only means "received"; the Raft-level answer is a separate message.
message SendAck {}

// LogEntry is one command in the replicated log. Index is 1-based and assigned
// by the leader; term is the leader's term when the entry was created. The pair
// (index, term) uniquely identifies an entry across the whole cluster, which is
// what the log-matching consistency check relies on.
message LogEntry {
  uint64 index = 1;
  uint64 term = 2;
  // Opaque payload. Once Raft is wired into the engine (Week 14) this carries a
  // serialized history mutation; Raft itself never interprets it.
  bytes data = 3;
}

// HardState is the part of a node's state that MUST survive a crash besides the
// log (paper §5, Figure 2 "Persistent state on all servers"). It is durable
// before the node sends any message that depends on it: a node that forgot its
// term or its vote could vote twice in one term after a restart, and two
// leaders could then be elected for that term.
message HardState {
  uint64 current_term = 1;
  // Candidate this node voted for in current_term; empty means it hasn't voted.
  string voted_for = 2;
}

message RequestVoteRequest {
  // Candidate's term.
  uint64 term = 1;
  // Who is asking, so the voter can record who it voted for.
  string candidate_id = 2;
  // The candidate's last log entry. The voter refuses to vote for a candidate
  // whose log is less up to date than its own. This is the Leader Completeness
  // guarantee: a leader can never be elected while missing committed entries.
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}

message RequestVoteResponse {
  // The voter's term, so a stale candidate learns it has fallen behind.
  uint64 term = 1;
  bool vote_granted = 2;
}

message AppendEntriesRequest {
  // Leader's term.
  uint64 term = 1;
  // So followers can redirect clients (and so logs name the leader).
  string leader_id = 2;
  // The entry immediately preceding the new ones. The follower rejects the
  // request unless its own log matches at that position: the induction step
  // that keeps every log identical up to the point of agreement.
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  // Empty for a heartbeat.
  repeated LogEntry entries = 5;
  // The leader's commit index, so followers learn what is safely replicated.
  uint64 leader_commit = 6;
}

message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
  // On success, the highest index the follower now has in common with the
  // leader, so the leader can advance match_index without guessing.
  uint64 match_index = 3;
  // On failure, where the leader should retry from: one past the follower's
  // last entry, or the first index of the follower's conflicting term, so the
  // leader backs up a whole term at a time instead of one entry (§5.3).
  uint64 conflict_index = 4;
}

// SnapshotMeta names the last log entry a snapshot replaces. Everything up to
// and including it is folded into the snapshot's data and dropped from the log.
message SnapshotMeta {
  uint64 last_included_index = 1;
  uint64 last_included_term = 2;
}

// InstallSnapshotRequest is how a leader catches up a follower that needs
// entries the leader has already compacted away (paper §7). The whole
// snapshot travels in one message; workflowd's snapshots are small.
message InstallSnapshotRequest {
  uint64 term = 1;
  string leader_id = 2;
  SnapshotMeta meta = 3;
  // The state machine's serialized state as of meta.last_included_index.
  bytes data = 4;
}

message InstallSnapshotResponse {
  uint64 term = 1;
  // The index the follower now holds everything up to: the snapshot's last
  // index, or the follower's commit index if that was already further along.
  uint64 match_index = 2;
}
