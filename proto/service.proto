syntax = "proto3";

package workflow.v1;

// Workflow tasks carry raw history to the SDK that replays it.
import "event.proto";

// Generated Go (messages + gRPC stubs) lands in internal/server as package
// `server`, alongside the hand-written Engine that implements the service.
option go_package = "github.com/olayanju-1234/durable-workflow-engine/internal/server;server";

// WorkflowService is the bridge between the engine and external workers.
//
//   StartWorkflow — a client kicks off a new workflow execution.
//   PollTask      — a worker long-polls for the next step to run.
//   CompleteTask  — a worker reports a step's result, driving the workflow on.
//   Heartbeat     — a worker extends its lease on a long-running task.
//
// The engine owns all state (the append-only history); workers are stateless
// executors that only ever see one task at a time. Every dispatched task carries
// a lease: the worker must complete or heartbeat before the lease expires, or
// the engine treats the worker as dead and reassigns the task.
service WorkflowService {
  rpc StartWorkflow(StartWorkflowRequest) returns (StartWorkflowResponse);
  rpc PollTask(PollTaskRequest) returns (PollTaskResponse);
  rpc CompleteTask(CompleteTaskRequest) returns (CompleteTaskResponse);
  // SignalWorkflow delivers an external event to a running workflow, satisfying a
  // step that is waiting for that signal (or buffering it until one waits).
  rpc SignalWorkflow(SignalWorkflowRequest) returns (SignalWorkflowResponse);
  // Heartbeat proves the worker holding a lease is still alive, extending the
  // lease deadline. A rejected heartbeat means the lease was lost (the task was
  // reassigned) and the worker should abandon the work.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  // Visibility API — read-only inspection plus the one operator write
  // (terminate). These answer "what is running and where is it stuck" without
  // grepping history files.
  //
  //   ListWorkflows      — every workflow the engine knows, as summaries.
  //   GetWorkflow        — one workflow in detail: status, steps, attempts, errors.
  //   TerminateWorkflow  — operator kill switch: durably ends a running workflow.
  rpc ListWorkflows(ListWorkflowsRequest) returns (ListWorkflowsResponse);
  rpc GetWorkflow(GetWorkflowRequest) returns (GetWorkflowResponse);
  rpc TerminateWorkflow(TerminateWorkflowRequest) returns (TerminateWorkflowResponse);
  // CancelWorkflow ends a running workflow as CANCELLED: the expected outcome
  // when its work is no longer wanted (terminate is the operator's emergency
  // stop). Workers still running its activities learn it from their next
  // heartbeat or completion, which fail with an ActivityCancelled detail.
  // With graceful set, the workflow code is told instead, and may compensate
  // before it ends.
  rpc CancelWorkflow(CancelWorkflowRequest) returns (CancelWorkflowResponse);
  // ListWorkflowRuns lists every run kept for a workflow id: the current one
  // and the earlier runs continue-as-new (or id reuse) left behind.
  rpc ListWorkflowRuns(ListWorkflowRunsRequest) returns (ListWorkflowRunsResponse);
  // ResetWorkflow starts a finished run again from a point in its history: a
  // new run under the same id keeps the events before that point, so the code
  // replays them and carries on from there (by default, from the step whose
  // failure ended the run). The finished run is kept as an earlier run.
  rpc ResetWorkflow(ResetWorkflowRequest) returns (ResetWorkflowResponse);

  // ---- Polyglot workflow execution -------------------------------------
  //
  // Workflow code does not have to run inside the engine. These three RPCs let
  // an SDK in ANY language own the orchestration logic:
  //
  //   RegisterWorkflowType — "I can run workflows of this type."
  //   PollWorkflowTask     — receive a workflow's history to replay.
  //   CompleteWorkflowTask — return the single next command.
  //
  // The engine stays the durable authority: it owns the history, applies the
  // returned command, and records the resulting event. The SDK is a pure
  // function from history to the next command — no state of its own, which is
  // why a crashed SDK worker costs nothing but a re-dispatch.
  //
  // This is the same split as activities (PollTask/CompleteTask), applied one
  // level up: activities are *what the work is*, workflow tasks are *what to
  // do next*.
  rpc RegisterWorkflowType(RegisterWorkflowTypeRequest) returns (RegisterWorkflowTypeResponse);
  rpc PollWorkflowTask(PollWorkflowTaskRequest) returns (PollWorkflowTaskResponse);
  rpc CompleteWorkflowTask(CompleteWorkflowTaskRequest) returns (CompleteWorkflowTaskResponse);

  // ---- Schedules ---------------------------------------------------------
  //
  // A schedule starts a workflow every time a cron expression fires. Schedules
  // are durable (recorded in the engine's history, replicated in a cluster)
  // and fire on the leader only. Each fire starts the workflow under the id
  // "<schedule_id>-<fire time, UTC, 20060102T150405Z>", so a fire retried
  // after a restart or a leader change can never start a second run.
  //
  //   CreateSchedule — create, or replace one with the same id.
  //   DeleteSchedule — stop firing; runs already started carry on.
  //   ListSchedules  — every schedule and when it fires next.
  rpc CreateSchedule(CreateScheduleRequest) returns (CreateScheduleResponse);
  rpc DeleteSchedule(DeleteScheduleRequest) returns (DeleteScheduleResponse);
  rpc ListSchedules(ListSchedulesRequest) returns (ListSchedulesResponse);
  // PauseSchedule stops a schedule firing until ResumeSchedule; fires due
  // while it is paused are not started later.
  rpc PauseSchedule(PauseScheduleRequest) returns (PauseScheduleResponse);
  rpc ResumeSchedule(ResumeScheduleRequest) returns (ResumeScheduleResponse);
  // BackfillSchedule starts the runs a schedule would have started over a
  // past range: one per fire time, under the same ids a fire uses, so it is
  // idempotent.
  rpc BackfillSchedule(BackfillScheduleRequest) returns (BackfillScheduleResponse);
  // PreviewSchedule says when a schedule (or a spec not yet created) fires next.
  rpc PreviewSchedule(PreviewScheduleRequest) returns (PreviewScheduleResponse);
}

// OverlapPolicy decides what a fire does while an earlier run of the same
// schedule is still running.
enum OverlapPolicy {
  // ALLOW_ALL, or SKIP when skip_if_running is set: what every engine before
  // 0.4.0 did.
  OVERLAP_POLICY_UNSPECIFIED = 0;
  // Skip the fire.
  OVERLAP_POLICY_SKIP = 1;
  // Keep the latest skipped fire and start it as soon as the running one
  // finishes; later fires while one is buffered are skipped.
  OVERLAP_POLICY_BUFFER_ONE = 2;
  // Start it anyway: runs overlap.
  OVERLAP_POLICY_ALLOW_ALL = 3;
}

message Schedule {
  // Unique, and the prefix of every run's workflow id.
  string schedule_id = 1;
  // Five-field cron ("*/15 9-17 * * MON-FRI"), a macro (@hourly, @daily,
  // @weekly, @monthly, @yearly) or "@every <duration>" (at least 1s).
  string cron = 2;
  // IANA time zone for the cron fields, e.g. "Europe/London"; empty is UTC.
  string timezone = 3;
  string workflow_type = 4;
  bytes input = 5;
  // Skip a fire while an earlier run of this schedule is still running.
  bool skip_if_running = 6;
  // The task queue the runs start on; empty is the default queue.
  string task_queue = 7;
  // A paused schedule does not fire; note says why (who paused it, until when).
  bool paused = 8;
  string note = 9;
  // What a fire does while an earlier run is still running. Setting
  // skip_if_running is the same as SKIP.
  OverlapPolicy overlap_policy = 10;
  // Start each run up to this long after its fire time, by an offset fixed
  // per fire, to spread schedules that fire together. The run's id keeps
  // the fire time.
  int64 jitter_ms = 11;
}

message ScheduleInfo {
  Schedule schedule = 1;
  // Unix nanoseconds.
  int64 created_at = 2;
  // Unix nanoseconds of the next fire; zero if it never fires again, or the
  // schedule is paused.
  int64 next_fire_at = 3;
  // A fire held by OVERLAP_POLICY_BUFFER_ONE until the running run finishes
  // (unix nanoseconds of its fire time; zero: none).
  int64 buffered_fire_at = 4;
}

message PauseScheduleRequest {
  string schedule_id = 1;
  string note = 2;
}

message PauseScheduleResponse {}

message ResumeScheduleRequest {
  string schedule_id = 1;
}

message ResumeScheduleResponse {}

message BackfillScheduleRequest {
  string schedule_id = 1;
  // Fire times after start and at or before end (unix nanoseconds), both in
  // the past. At most 1,000 fires per call.
  int64 start_time = 2;
  int64 end_time = 3;
  // ALLOW_ALL (the default) starts every fire; SKIP starts a fire only if no
  // run of the schedule is running then.
  OverlapPolicy overlap_policy = 4;
}

message BackfillScheduleResponse {
  int32 started = 1;
  // Fires whose run already exists (an earlier fire or backfill started it).
  int32 existing = 2;
  // Fires skipped by the overlap policy.
  int32 skipped = 3;
}

message PreviewScheduleRequest {
  // An existing schedule, or a spec to try (schedule_id may be empty).
  string schedule_id = 1;
  Schedule schedule = 2;
  // How many fires (default 10, at most 1,000).
  int32 count = 3;
}

message PreviewScheduleResponse {
  // The next fire times (unix nanoseconds), and when each run would start
  // with the schedule's jitter.
  repeated int64 fire_times = 1;
  repeated int64 start_times = 2;
  bool paused = 3;
}

message CreateScheduleRequest {
  Schedule schedule = 1;
}

message CreateScheduleResponse {}

message DeleteScheduleRequest {
  string schedule_id = 1;
}

message DeleteScheduleResponse {}

message ListSchedulesRequest {}

message ListSchedulesResponse {
  repeated ScheduleInfo schedules = 1;
}

message RegisterWorkflowTypeRequest {
  // Workflow types this worker can replay, e.g. ["OrderWorkflow"].
  repeated string workflow_types = 1;
  // Identifies the SDK worker, for logs.
  string worker_id = 2;
  // Informational: the SDK language/version, e.g. "typescript/0.1.0".
  string sdk = 3;
}

message RegisterWorkflowTypeResponse {}

message PollWorkflowTaskRequest {
  string worker_id = 1;
  // Only receive tasks for these types. A worker that registered several types
  // normally passes all of them.
  repeated string workflow_types = 2;
  // The task queue to poll; empty is the default queue.
  string task_queue = 3;
}

// WorkflowTask asks "given this history, what happens next?". It carries the
// workflow's ENTIRE history: the SDK is stateless, so everything it needs to
// reconstruct the workflow's position is in this message.
message WorkflowTask {
  string workflow_id = 1;
  string workflow_type = 2;
  repeated history.v1.HistoryEvent history = 3;
  // Proof of ownership, presented on CompleteWorkflowTask.
  string task_token = 4;
  // How many events the decision is based on. The engine rejects a completion
  // whose history has moved on since — optimistic concurrency, which is what
  // makes re-dispatching a workflow task safe (see CompleteWorkflowTask).
  int64 history_length = 5;
  // The run this history belongs to.
  string run_id = 6;
  // The id of the event at which the history crossed the engine's warning
  // threshold (a share of its event and size limits), zero until it does.
  // Code that has observed a result at or after it should continue as new;
  // because it is an event id, replay sees the same answer every time.
  int64 suggest_continue_as_new_at = 7;
  // The history's size in bytes, as stored.
  int64 history_size_bytes = 8;
  // The task queue the task was routed by ("default" for the default queue).
  string task_queue = 9;
}

message PollWorkflowTaskResponse {
  WorkflowTask task = 1;
}

// ---- Commands the SDK can return ----
//
// A task's answer is every new command the workflow code issued before it
// blocked: several activities and timers can be in flight at once. Commands
// that open a step take consecutive sequence numbers; a complete or fail
// command, if any, comes last.

// ScheduleActivityCommand: run a named activity on a worker.
message ScheduleActivityCommand {
  string step_name = 1;
  int64 sequence = 2;
  bytes input = 3;
  // Optional: overrides the engine's retry policy for this step name. It is
  // recorded on the step, so the retries survive restarts and failovers.
  history.v1.RetryPolicy retry_policy = 4;
  // Optional, zero = no limit: one attempt's time from dispatch to result, and
  // the whole step's time across every attempt (see StepScheduledEvent).
  int64 start_to_close_timeout_ms = 5;
  int64 schedule_to_close_timeout_ms = 6;
  // Optional: the task queue to run the activity on. Empty runs it on the
  // workflow's own queue.
  string task_queue = 7;
}

// StartTimerCommand: sleep durably. delay_ms is relative; the engine converts
// it to an absolute deadline and records that, so restarts re-arm correctly.
message StartTimerCommand {
  string step_name = 1;
  int64 sequence = 2;
  int64 delay_ms = 3;
  bytes input = 4;
}

// AwaitSignalCommand: park until a matching external signal arrives.
message AwaitSignalCommand {
  string step_name = 1;
  int64 sequence = 2;
  string signal_name = 3;
  bytes input = 4;
}

// RecordMarkerCommand: record a version choice or a side effect's result. The
// marker step completes immediately and the engine asks for the next decision.
message RecordMarkerCommand {
  string step_name = 1;
  int64 sequence = 2;
  string marker = 3;
  bytes data = 4;
}

// CancelStepCommand: workflow code no longer wants a step that is still open
// (the loser of a race, say). The engine records it as cancelled: a timer stops
// mattering, a signal wait stops consuming signals, and an activity's worker
// is told to stop. A step that already has a result is left alone. It refers
// to an existing step by sequence and takes no sequence of its own.
message CancelStepCommand {
  string step_name = 1;
  int64 sequence = 2;
  string reason = 3;
}

message CompleteWorkflowCommand {
  bytes output = 1;
}

message FailWorkflowCommand {
  string error = 1;
  // The workflow ends because it was cancelled: workflow code received a
  // graceful cancellation and let it end the workflow. Recorded as CANCELLED
  // when a cancel was requested, as FAILED otherwise.
  bool cancelled = 2;
}

// ContinueAsNewCommand ends this run and starts a fresh one under the same
// workflow id with an empty history: how a workflow that loops forever keeps
// its history small. Unset fields keep this run's type and execution timeout.
message ContinueAsNewCommand {
  bytes input = 1;
  string workflow_type = 2;
  int64 execution_timeout_ms = 3;
  // The next run's task queue; empty keeps this run's.
  string task_queue = 4;
}

message WorkflowCommand {
  oneof command {
    ScheduleActivityCommand schedule_activity = 1;
    StartTimerCommand start_timer = 2;
    AwaitSignalCommand await_signal = 3;
    CompleteWorkflowCommand complete_workflow = 4;
    FailWorkflowCommand fail_workflow = 5;
    RecordMarkerCommand record_marker = 6;
    CancelStepCommand cancel_step = 7;
    ContinueAsNewCommand continue_as_new = 8;
  }
}

message CompleteWorkflowTaskRequest {
  string workflow_id = 1;
  string task_token = 2;
  // The next thing to do. Omit it to report "nothing to do yet" (the workflow
  // is blocked on a step already in flight).
  WorkflowCommand command = 3;
  // Set when the SDK could not replay the history — e.g. the workflow code no
  // longer matches the recorded run (non-determinism). The engine records this
  // as a workflow failure rather than looping on a task it can never complete.
  string replay_error = 4;
  // Several commands at once, applied in order (parallel steps). Use either
  // this or command; SDKs send a single command in command so engines that
  // predate this field still understand them.
  repeated WorkflowCommand commands = 5;
}

message CompleteWorkflowTaskResponse {}

// WorkflowStatus mirrors the engine's reconstructed lifecycle states.
// TERMINATED is a presentation of FAILED-by-operator: on disk it is a
// WorkflowFailed event with the terminated flag set.
enum WorkflowStatus {
  WORKFLOW_STATUS_UNSPECIFIED = 0;
  WORKFLOW_STATUS_RUNNING = 1;
  WORKFLOW_STATUS_WAITING = 2;
  WORKFLOW_STATUS_COMPLETED = 3;
  WORKFLOW_STATUS_FAILED = 4;
  WORKFLOW_STATUS_TIMED_OUT = 5;
  WORKFLOW_STATUS_TERMINATED = 6;
  // Cancelled by a client; on disk a WorkflowFailed event with cancelled set.
  WORKFLOW_STATUS_CANCELLED = 7;
  // A finished run that continued as new; its workflow id goes on as a new run.
  WORKFLOW_STATUS_CONTINUED_AS_NEW = 8;
}

message StartWorkflowRequest {
  // The registered workflow type to run (e.g. "OrderWorkflow").
  string workflow_type = 1;
  // Opaque input handed to the first step.
  bytes input = 2;
  // Optional caller-chosen id; the server generates one when empty.
  string workflow_id = 3;
  // Optional: the workflow times out (status TIMED_OUT) this long after it
  // starts. Zero means no limit.
  int64 execution_timeout_ms = 4;
  // Whether a workflow id whose run has finished may start a new run.
  IdReusePolicy id_reuse_policy = 5;
  // What to do when the workflow id is taken: a run is still going, or a
  // finished one the reuse policy does not let this start replace.
  IdConflictPolicy id_conflict_policy = 6;
  // The task queue the workflow runs on: its workflow tasks, and its
  // activities unless they name another. Empty is the default queue, which
  // workers that name no queue poll.
  string task_queue = 7;
}

// IdReusePolicy decides whether a start may begin a new run under a workflow
// id whose latest run has finished. The finished run is kept as an earlier run.
enum IdReusePolicy {
  // REJECT_DUPLICATE: what every engine did before 0.3.0.
  ID_REUSE_POLICY_UNSPECIFIED = 0;
  ID_REUSE_POLICY_ALLOW_DUPLICATE = 1;
  // Only if the finished run failed, timed out, was cancelled or terminated.
  ID_REUSE_POLICY_ALLOW_DUPLICATE_FAILED_ONLY = 2;
  ID_REUSE_POLICY_REJECT_DUPLICATE = 3;
}

// IdConflictPolicy decides what a start does when its workflow id is taken.
enum IdConflictPolicy {
  // FAIL: the start fails with ALREADY_EXISTS (HTTP 409).
  ID_CONFLICT_POLICY_UNSPECIFIED = 0;
  ID_CONFLICT_POLICY_FAIL = 1;
  // Return the run that holds the id instead (started = false): "start, or
  // give me the one already there".
  ID_CONFLICT_POLICY_USE_EXISTING = 2;
}

message StartWorkflowResponse {
  string workflow_id = 1;
  // The run this start began, or with USE_EXISTING the run that held the id.
  string run_id = 2;
  // False when an existing run was returned instead of starting one.
  bool started = 3;
}

message PollTaskRequest {
  // Identifies the worker; recorded on the lease and in engine logs, so a lease
  // expiry names the worker that went dark.
  string worker_id = 1;
  // Only receive tasks for these activities (step names). Empty means any task
  // on the queue, which is only safe when one worker implements every activity.
  repeated string step_names = 2;
  // The task queue to poll; empty is the default queue.
  string task_queue = 3;
}

// Task is one unit of work dispatched to exactly one worker, under a lease.
message Task {
  string workflow_id = 1;
  string step_name = 2;
  int64 sequence = 3;
  bytes input = 4;
  // Proof of ownership: CompleteTask and Heartbeat must present this token.
  // A stale token (the lease expired and the task was reassigned) is rejected.
  string lease_token = 5;
  // How long the lease lives without a heartbeat. Workers running longer than
  // this must Heartbeat periodically (a third of this is a sane interval).
  int64 lease_duration_ms = 6;
  // The attempt's start-to-close timeout, zero if none: the engine fails the
  // attempt this long after dispatch, so a worker may stop the work then too.
  int64 start_to_close_timeout_ms = 7;
  // Which attempt this is, from 1. Retries and re-dispatches of the same step
  // share sequence; the attempt counts the engine's retries.
  int32 attempt = 8;
  // "<workflow_id>/<sequence>": the same for every attempt of the step, so a
  // good idempotency key for the side effect the activity performs.
  string activity_id = 9;
  // The task queue the task was routed by ("default" for the default queue).
  string task_queue = 10;
}

message PollTaskResponse {
  Task task = 1;
}

message CompleteTaskRequest {
  string workflow_id = 1;
  string step_name = 2;
  int64 sequence = 3;
  // Exactly one of output/error is set: output (even if empty) means success,
  // error means the step failed.
  oneof result {
    bytes output = 4;
    string error = 5;
  }
  // The lease token from the dispatched Task. Results without the current
  // lease are rejected — a worker that lost its lease must not record anything.
  string lease_token = 6;
  // With an error: the kind of failure, matched against the step's retry
  // policy's non_retryable_error_types (SDKs send the error's class name).
  string error_type = 7;
  // With an error: fail the step now, without retrying, whatever the policy.
  bool non_retryable = 8;
}

message CompleteTaskResponse {}

message HeartbeatRequest {
  string workflow_id = 1;
  // The lease token from the dispatched Task.
  string lease_token = 2;
  // For logging only; the token is the proof of ownership.
  string worker_id = 3;
}

message HeartbeatResponse {}

// ActivityCancelled is attached as a status detail when Heartbeat or
// CompleteTask turns a worker away because its step was cancelled or its
// workflow finished, rather than because its lease was lost. Either way the
// worker should stop; this says the work is no longer wanted at all.
message ActivityCancelled {
  string reason = 1;
}

message SignalWorkflowRequest {
  string workflow_id = 1;
  string signal_name = 2;
  bytes payload = 3;
  // Optional idempotency key, unique per signal the caller means to send.
  // Retrying with the same key records the signal at most once, across
  // restarts and leader changes (the key is kept in history).
  string request_id = 4;
}

message SignalWorkflowResponse {}

message ListWorkflowsRequest {
  // When set (not UNSPECIFIED), only workflows in this status are returned.
  WorkflowStatus status_filter = 1;
}

// WorkflowSummary is the list-view row: enough to see what exists and whether
// it needs attention, without the per-step detail of GetWorkflow.
message WorkflowSummary {
  string workflow_id = 1;
  string workflow_type = 2;
  WorkflowStatus status = 3;
  // Unix nanoseconds of the first and latest history events. closed_at is only
  // meaningful once the status is terminal; until then it is "last activity".
  int64 started_at = 4;
  int64 updated_at = 5;
  // Workflow error when FAILED/TERMINATED. For a workflow whose history could
  // not be read or replayed, status is UNSPECIFIED and this carries the reason
  // — a broken log must be visible to operators, never silently skipped.
  string error = 6;
  int64 history_length = 7;
  // The run this summary describes, and its history's size in bytes.
  string run_id = 8;
  int64 history_size_bytes = 9;
  // The run's task queue ("default" for the default queue).
  string task_queue = 10;
}

message ListWorkflowsResponse {
  repeated WorkflowSummary workflows = 1;
}

message GetWorkflowRequest {
  string workflow_id = 1;
  // An earlier run of the workflow id (see ListWorkflowRuns); empty means the
  // current one.
  string run_id = 2;
}

// StepInfo is the reconstructed view of one step, as replayed from history.
message StepInfo {
  string step_name = 1;
  int64 sequence = 2;
  // "ACTIVITY", "TIMER", "SIGNAL", or "MARKER".
  string kind = 3;
  // "SCHEDULED", "COMPLETED", "FAILED" or "CANCELLED". A step still open when
  // its workflow finished is presented as CANCELLED: nothing will use it.
  string status = 4;
  // How many times this step has been scheduled (>1 means it was retried).
  int32 attempts = 5;
  string error = 6;
  bytes output = 7;
  // Timer steps: unix-nanoseconds deadline. Signal steps: the awaited signal.
  int64 fire_at = 8;
  string signal_name = 9;
  // Marker steps: "version" or "side_effect".
  string marker = 10;
  // Failed steps: the kind of failure the worker (or engine) reported.
  string error_type = 11;
  // Activity steps: the task queue their tasks go to ("default" for the
  // default queue).
  string task_queue = 12;
}

message GetWorkflowResponse {
  WorkflowSummary summary = 1;
  repeated StepInfo steps = 2;
  bytes input = 3;
  // Workflow output once COMPLETED.
  bytes output = 4;
  // The run this one continued from, and (for a run that continued as new)
  // the run that followed it.
  string continued_from_run_id = 5;
  string continued_as_new_run_id = 6;
  // A graceful cancel was requested (and why): the workflow code has been
  // told and is ending.
  bool cancel_requested = 7;
  string cancel_reason = 8;
  // The run this one was reset from, if an operator reset it.
  string reset_from_run_id = 9;
  // Where ResetWorkflow with no event id would reset this finished run (zero:
  // it is not finished, or has no such step), and that step.
  int64 reset_event_id = 10;
  string reset_step_name = 11;
  int64 reset_step_sequence = 12;
}

message ListWorkflowRunsRequest {
  string workflow_id = 1;
}

// RunInfo is one run of a workflow id: the current one first, then earlier
// runs (continued as new, or finished before the id was reused), newest first.
message RunInfo {
  string run_id = 1;
  WorkflowStatus status = 2;
  // Unix nanoseconds.
  int64 started_at = 3;
  int64 closed_at = 4;
  bool current = 5;
}

message ListWorkflowRunsResponse {
  repeated RunInfo runs = 1;
}

message TerminateWorkflowRequest {
  string workflow_id = 1;
  // Recorded in the workflow's terminal event, so history says who/why.
  string reason = 2;
}

message TerminateWorkflowResponse {}

message CancelWorkflowRequest {
  string workflow_id = 1;
  // Recorded in the workflow's terminal event.
  string reason = 2;
  // Graceful: record a cancel request and tell the workflow code, which may
  // compensate before it ends CANCELLED, instead of ending the workflow now.
  bool graceful = 3;
}

message CancelWorkflowResponse {}

message ResetWorkflowRequest {
  string workflow_id = 1;
  // The first event of the finished run to leave out: the new run keeps
  // events 1 to event_id - 1. Zero picks the opening event of the step whose
  // failure ended the run (or the step it was waiting on when it was
  // cancelled, terminated or timed out).
  int64 event_id = 2;
  // Recorded on the new run's WorkflowStarted.
  string reason = 3;
}

message ResetWorkflowResponse {
  // The new run.
  string run_id = 1;
  // The event the reset left out, and the run it was reset from.
  int64 reset_event_id = 2;
  string previous_run_id = 3;
  // Signals recorded after that event, recorded again on the new run.
  int32 reapplied_signals = 4;
}
