name: Release SDKs

# Manual only: Actions → Release SDKs → Run workflow (on main). Builds the TypeScript,
# Python and Java packages and, unless dry_run is ticked, publishes them: npm and PyPI by
# trusted publishing (OIDC), Maven with repository secrets. Setup and steps: sdks/README.md.
on:
  workflow_dispatch:
    inputs:
      registries:
        description: Where to publish
        type: choice
        options: [all, npm, pypi, maven]
        default: all
      dry_run:
        description: Build and validate only; publish nothing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-sdks
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Release from main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow on main, not ${GITHUB_REF}"
          exit 1

      - uses: actions/checkout@v4

      # A real publish also needs a "## [<version>]" section in CHANGELOG.md.
      - id: version
        env:
          FLAGS: ${{ !inputs.dry_run && '--release' || '' }}
        run: |
          version=$(python3 scripts/sdk-version.py $FLAGS)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "SDK version $version (dry run: ${{ inputs.dry_run }})" >> "$GITHUB_STEP_SUMMARY"

  npm:
    needs: version
    if: inputs.registries == 'all' || inputs.registries == 'npm'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC, no NPM_TOKEN) and provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm 11.5.1+; the package's npm settings name this workflow.
      - name: Use an npm with trusted publishing
        run: npm install -g npm@^11.5.1 && npm --version

      - name: Type-check the declarations
        working-directory: sdks/typescript
        run: ./check-package.sh

      - name: Publish workflowd@${{ needs.version.outputs.version }}
        working-directory: sdks/typescript
        env:
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          cp ../../LICENSE ../../NOTICE .
          npm publish --access public --provenance $DRY_RUN

  pypi:
    needs: version
    if: inputs.registries == 'all' || inputs.registries == 'pypi'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing: GitHub's OIDC token replaces an API token
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build and check
        working-directory: sdks/python
        run: |
          cp ../../LICENSE ../../NOTICE .
          python -m pip install --quiet build==1.2.2 twine==6.0.1
          python -m build
          twine check --strict dist/*

      # Needs a trusted publisher on PyPI for this repo + release-sdks.yml (see sdks/README.md).
      - name: Publish workflowd==${{ needs.version.outputs.version }}
        if: ${{ !inputs.dry_run }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist/

  maven:
    needs: version
    if: inputs.registries == 'all' || inputs.registries == 'maven'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Writes a settings.xml whose "central" server reads the two env vars below,
      # and imports the signing key (skipped on a dry run).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ !inputs.dry_run && secrets.MAVEN_GPG_PRIVATE_KEY || '' }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Check the credentials are set
        if: ${{ !inputs.dry_run }}
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          for s in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD MAVEN_GPG_PRIVATE_KEY MAVEN_GPG_PASSPHRASE; do
            [ -n "${!s}" ] || { echo "::error::Repository secret $s is not set"; exit 1; }
          done

      - name: Build, sources and javadoc (dry run)
        if: inputs.dry_run
        working-directory: sdks/java
        run: mvn -B -ntp -P release -Dgpg.skip verify

      - name: Sign and publish io.github.olayanju-1234:workflowd:${{ needs.version.outputs.version }}
        if: ${{ !inputs.dry_run }}
        working-directory: sdks/java
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: mvn -B -ntp -P release deploy
