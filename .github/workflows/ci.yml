name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test (race)
        run: go test ./... -race -count=1

  # Each SDK's example worker runs against a real engine built in the same job:
  # one approved order completes, one rejected order compensates and fails.
  sdk-e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [typescript, python, java]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - if: matrix.sdk == 'typescript'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - if: matrix.sdk == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # JDK 21 compiles with --release 11, so the SDK's Java 11 floor is checked too.
      - if: matrix.sdk == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: End to end against workflowd
        run: ./scripts/sdk-e2e.sh ${{ matrix.sdk }}
