name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test (race)
        run: go test ./... -race -count=1

  # Each SDK's example worker runs against a real engine built in the same job,
  # in plaintext and then over TLS with a required token: one approved order
  # completes, one rejected order compensates and fails.
  sdk-e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [typescript, python, java]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - if: matrix.sdk == 'typescript'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - if: matrix.sdk == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # JDK 21 compiles with --release 11 and lint warnings as errors (serial lint
      # off: the SDK's exceptions are never serialized), so Java 11 is checked too.
      - if: matrix.sdk == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build workflowd
        run: go build -o "$RUNNER_TEMP/workflowd" ./cmd/workflowd

      - name: End to end against workflowd
        run: WORKFLOWD_BIN="$RUNNER_TEMP/workflowd" ./scripts/sdk-e2e.sh ${{ matrix.sdk }}

      - name: End to end over TLS with a required token
        run: E2E_SECURE=1 WORKFLOWD_BIN="$RUNNER_TEMP/workflowd" ./scripts/sdk-e2e.sh ${{ matrix.sdk }}

  # Proto lint and wire-compatibility check (ADR-0002). buf is a CI tool, not a
  # Go dependency; the binary is pinned and checksum-verified.
  proto:
    runs-on: ubuntu-latest
    env:
      BUF_VERSION: '1.73.0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install buf
        run: |
          mkdir -p "$RUNNER_TEMP/buf" && cd "$RUNNER_TEMP/buf"
          base="https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}"
          curl -sSfLO "$base/buf-Linux-x86_64" && curl -sSfLO "$base/sha256.txt"
          grep ' buf-Linux-x86_64$' sha256.txt | sha256sum -c -
          chmod +x buf-Linux-x86_64 && mv buf-Linux-x86_64 buf
          echo "$RUNNER_TEMP/buf" >> "$GITHUB_PATH"

      - name: Lint
        run: buf lint

      # A PR is checked against its base; a push to main against the commit before it.
      - name: Breaking changes
        env:
          AGAINST: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: buf breaking --against ".git#ref=${AGAINST},subdir=proto"
